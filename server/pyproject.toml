[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revitsync"
version = "0.1.0"
description = "Local sync server for the Revit to Apple Vision Pro pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
revitsync = "revitsync.main:main"

[tool.setuptools]
packages = ["revitsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
